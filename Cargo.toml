[package]
name = "fsearch"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/musabasaleh-byte/fsearch"
build = "build.rs"
description = "Spotlight-style fast file search: metadata + content index, query language, live watcher"

[features]
gui = ["dep:eframe"]
bundle = ["gui"]      # the installer: needs payload/fsearch.exe and payload/fsearch-gui.exe
x11 = ["eframe/x11"]   # only for trying the GUI on Linux

[[bin]]
name = "fsearch-gui"
path = "src/bin/fsearch-gui.rs"
required-features = ["gui"]

[[bin]]
name = "fsearch-setup"
path = "src/bin/fsearch-setup.rs"
required-features = ["bundle"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"], optional = true }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
notify = "6"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
unicode-bidi = "0.3"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Registry", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_UI_HiDpi"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
